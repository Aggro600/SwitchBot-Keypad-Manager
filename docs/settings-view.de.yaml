# SwitchBot Keypad Manager – Einstellungen von Keypad und Schloss als eigene Ansicht (deutsche Oberfläche)
# Dashboard → Bearbeiten → Ansicht hinzufügen → ⋮ → YAML bearbeiten → alles unterhalb dieses Kommentars einfügen.
# Präfixe ersetzen: `keypad_haustur` (Keypad-Eintrag) und `schloss_haustur` (Schloss-Eintrag „Schloss Haustür“).
# Englische Oberfläche: Abschnitte "Keypad settings" / "Lock settings" in dashboard.yaml.

type: sections
title: Keypad-Einstellungen
path: keypad-einstellungen
sections:
- type: grid
  cards:
  - type: heading
    heading: Schloss-Einstellungen
    icon: mdi:lock-cog
  - type: tile
    entity: select.schloss_haustur_motorgeschwindigkeit
    grid_options:
      columns: 12
    name: Motorgeschwindigkeit
  - type: tile
    entity: switch.schloss_haustur_led_licht
    grid_options:
      columns: 6
    name: LED-Licht
  - type: tile
    entity: switch.schloss_haustur_ton
    grid_options:
      columns: 6
    name: Ton
  - type: tile
    entity: switch.schloss_haustur_automatisch_verriegeln
    grid_options:
      columns: 6
    name: Automatisch verriegeln
  - type: tile
    entity: number.schloss_haustur_automatisch_verriegeln_nach
    grid_options:
      columns: 6
    name: nach (s)
    visibility:
    - condition: state
      entity: switch.schloss_haustur_automatisch_verriegeln
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_auto_verriegeln_pausieren
    grid_options:
      columns: 6
    name: Auto-Verriegeln pausieren
