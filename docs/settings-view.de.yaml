    grid_options:
      columns: 6
    name: Halb verriegeln
  - type: tile
    entity: switch.schloss_haustur_taste_am_schloss
    grid_options:
      columns: 6
    name: Taste am Schloss
  - type: tile
    entity: select.schloss_haustur_taste_drucken
    grid_options:
      columns: 6
    name: 'Taste: Drücken'
    visibility:
    - condition: state
      entity: switch.schloss_haustur_taste_am_schloss
      state: 'on'
  - type: tile
    entity: select.schloss_haustur_taste_aktion
    grid_options:
      columns: 12
    name: 'Taste: Aktion'
    visibility:
    - condition: state
      entity: switch.schloss_haustur_taste_am_schloss
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_ibeacon
    grid_options:
      columns: 6
    name: iBeacon
  - type: tile
    entity: button.schloss_haustur_einstellungen_lesen
    grid_options:
      columns: 6
    name: Einstellungen lesen
  - type: heading
    heading: Nachtmodus
    heading_style: subtitle
  - type: tile
    entity: switch.schloss_haustur_nachtmodus
    grid_options:
      columns: 12
    name: Nachtmodus
  - type: tile
    entity: time.schloss_haustur_nachtmodus_von
    grid_options:
      columns: 6
    name: von
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: time.schloss_haustur_nachtmodus_bis
    grid_options:
      columns: 6
    name: bis
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: select.schloss_haustur_nachtmodus_motorgeschwindigkeit
    grid_options:
      columns: 6
    name: Geschwindigkeit
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_nachtmodus_ton
    grid_options:
      columns: 6
    name: Ton
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_nachtmodus_bei_beginn_verriegeln
    grid_options:
      columns: 6
    name: Bei Beginn verriegeln
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: select.schloss_haustur_nachtmodus_verriegeln
    grid_options:
      columns: 6
    name: Verriegeln
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_nachtmodus_automatisch_verriegeln
    grid_options:
      columns: 6
    name: Automatisch verriegeln
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: number.schloss_haustur_nachtmodus_verriegeln_nach
    grid_options:
      columns: 6
    name: nach (s)
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: tile
    entity: switch.schloss_haustur_nachtmodus_automatisch_entriegeln_erlaubt
    grid_options:
      columns: 12
    name: Automatisch entriegeln erlaubt
    visibility:
    - condition: state
      entity: switch.schloss_haustur_nachtmodus
      state: 'on'
  - type: markdown
    content: Einstellungen des Schlosses per Bluetooth – werden beim Start, alle 12 h, nach jeder Änderung und mit *Einstellungen lesen* aus dem Schloss gelesen. Geänderte Werte stehen sofort auch in der
      SwitchBot-App.
