# SwitchBot Keypad Manager – kompakte Benutzerverwaltung (eine Karte zum Kopieren)
# Dashboard → Bearbeiten → Karte hinzufügen → Manuell → alles unterhalb dieses Kommentars einfügen.
# Entitäts-IDs: Diese Datei setzt Home Assistant auf DEUTSCH und den Keypad-Namen "Keypad Haustür"
# (Präfix `keypad_haustur`) voraus. Jedes `keypad_haustur` durch dein Präfix ersetzen – das ist der
# Anfang der Entitäts-IDs, z. B. sensor.<präfix>_zuletzt_entsperrt. Englische Oberfläche: dashboard-card.en.yaml.

type: vertical-stack
cards:
- type: tile
  entity: sensor.keypad_haustur_zuletzt_entsperrt
  name: Zuletzt entsperrt
- type: markdown
  content: "{% set s = 'sensor.keypad_haustur_zugange' %}{{ (state_attr(s,'list') or 'Noch keine Einträge.').replace('\\n','  \\n') }}{% set o = state_attr(s,'unassigned') %}{% if o %}  \n*Im Keypad ohne\
    \ Namen:* {% for k,v in o.items() %}{{ k }} {{ v }}{{ ', ' if not loop.last }}{% endfor %} – in der Auswahl *Eintrag* als „Unbekannt – …“: zuordnen oder löschen.{% endif %}"
- type: entities
  title: Benutzer verwalten
  state_color: true
  entities:
  - entity: select.keypad_haustur_eintrag
    name: Eintrag
  - entity: select.keypad_haustur_person
    name: Person
  - entity: text.keypad_haustur_neue_person_optional
    name: Neue Person (optional)
  - entity: select.keypad_haustur_was
    name: Was?
  - type: conditional
    conditions:
    - condition: state
      entity: select.keypad_haustur_was
      state: pin_custom
    row:
      entity: text.keypad_haustur_pin_code_6_12_ziffern
      name: Eigener PIN (6–12 Ziffern)
  - entity: select.keypad_haustur_gultigkeit
    name: Gültigkeit
  - type: buttons
    entities:
    - entity: button.keypad_haustur_anlernen_starten
      name: Anlernen
      icon: mdi:account-plus
    - entity: button.keypad_haustur_eintrag_andern
      name: Ändern
      icon: mdi:account-edit
    - entity: button.keypad_haustur_eintrag_loschen
      name: Löschen
      icon: mdi:account-remove
    - entity: button.keypad_haustur_alles_loschen_keypad_liste
      name: Alles (2×)
      icon: mdi:delete-alert
  - type: buttons
    entities:
    - entity: button.keypad_haustur_letzte_entsperrung_zuordnen
      name: Zuordnen
      icon: mdi:account-arrow-left
    - entity: button.keypad_haustur_mit_keypad_abgleichen
      name: Abgleichen
      icon: mdi:sync
    - entity: button.keypad_haustur_abbrechen
      name: Abbrechen
      icon: mdi:cancel
  - type: divider
  - entity: sensor.keypad_haustur_status
    name: Status
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.keypad_haustur_status
      state: "Neuer PIN-Code – bitte notieren"
    row:
      type: attribute
      entity: sensor.keypad_haustur_status
      attribute: pin
      name: Neuer PIN-Code
      icon: mdi:dialpad
  - entity: switch.keypad_haustur_entsperren_freigeben
    name: Entsperren freigeben
  - entity: select.keypad_haustur_regel_fur_die_person
    name: Regel für die gewählte Person
  - entity: select.keypad_haustur_regel_fur_unbekannte_zugange
    name: Regel für Zugänge ohne Namen
  - entity: select.keypad_haustur_regel_fur_den_eintrag
    name: Regel für den Eintrag
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_von
      name: Zeitfenster von
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_bis
      name: Zeitfenster bis
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: select.keypad_haustur_zeitfenster_tage
      name: Zeitfenster Tage
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_2_von
      name: Fenster 2 von
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_2_bis
      name: Fenster 2 bis
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: select.keypad_haustur_zeitfenster_2_tage
      name: Fenster 2 Tage
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_3_von
      name: Fenster 3 von
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: time.keypad_haustur_zeitfenster_3_bis
      name: Fenster 3 bis
  - type: conditional
    conditions:
    - entity: select.keypad_haustur_regel_fur_den_eintrag
      state: time_window
    row:
      entity: select.keypad_haustur_zeitfenster_3_tage
      name: Fenster 3 Tage
  - entity: select.keypad_haustur_notweg_fur_den_eintrag
    name: Notweg für den Eintrag
  - entity: select.keypad_haustur_notweg_ohne_home_assistant
    name: Notweg ohne Home Assistant
- type: markdown
  content: "{% set s='sensor.keypad_haustur_zugange' %}{% set N={'always':'Immer öffnen','blocked':'Gesperrt','event_only':'Nur Automation','daytime':'Nur 6–22 Uhr','weekdays':'Nur werktags 7–19 Uhr','someone_home':'Nur\
    \ wenn jemand zu Hause ist','time_window':'Zeitfenster','inherit':'Wie die Person'} %}{% set R={'always':'Tür öffnet','blocked':'Tür bleibt zu (abgelehnt)','event_only':'Tür bleibt zu – es laufen nur\
    \ deine Automationen','daytime':'öffnet nur 6–22 Uhr','weekdays':'öffnet nur werktags 7–19 Uhr','someone_home':'öffnet nur, wenn jemand zu Hause ist','time_window':'öffnet nur in den Zeitfenstern'}\
    \ %}{% set sel=states('select.keypad_haustur_eintrag') %}{% set fm=state_attr(s,'fallback_mode') %}{% set e=(state_attr(s,'entries') or [])|selectattr('label','eq',sel)|list|first %}### Was passiert\
    \ bei diesem Zugang?\n{% if not is_state('switch.keypad_haustur_entsperren_freigeben','on') %}**Entsperren freigeben ist aus:** Die Bridge öffnet bei jedem erkannten Zugang sofort. Die Regeln gelten\
    \ erst, wenn du es einschaltest.\n{% elif e %}**{{ e.label }}**  \nRegel des Eintrags: *{{ N[e.rule] }}*{% if e.rule=='inherit' %} → also die Regel von **{{ e.person }}**: *{{ N[e.effective_rule] }}*{%\
    \ endif %}  \n➜ **{{ R[e.effective_rule] }}**{% if e.effective_rule in ['daytime','weekdays','someone_home','time_window'] %} – gerade: {{ 'öffnet' if e.decision_now=='open' else 'bleibt zu' }}{% endif\
    \ %}  \nOhne Home Assistant (Notweg): {{ 'Bridge öffnet selbst' if fm=='all' or (fm=='allowed' and e.fallback) else 'Tür bleibt zu' }}\n{% elif sel not in ['none','unknown','unavailable'] %}**{{ sel\
    \ }}** (ohne Namen)  \nEs gilt die *Regel für unbekannte Zugänge*: *{{ N[state_attr(s,'unknown_rule')] }}*  \n➜ **{{ R[state_attr(s,'unknown_rule')] }}**  \nOhne Home Assistant (Notweg): {{ 'Bridge\
    \ öffnet selbst' if fm=='all' else 'Tür bleibt zu' }}\n{% else %}Wähle oben einen **Eintrag** – hier steht dann in Klartext, was bei diesem Finger/Gesicht/… passiert.{% endif %}"
- type: markdown
  content: |-
    **Neu:** Person + Was (+ Gültigkeit) → *Anlernen* → ans Keypad.
    **Ändern:** Eintrag wählen (Person/Was werden vorbelegt) → umstellen → *Ändern*.
    **Löschen:** Eintrag wählen → *Löschen* – immer im Keypad *und* in der Liste, auch *Unbekannt – …* (Home Assistant sucht den Platz selbst). *Alles (2×)* = zweimal in 15 s.
    **Ohne Namen:** damit entsperren → Person/Was wählen → *Zuordnen*.

    **Welche Regel gilt?** (nur bei *Entsperren freigeben* = an; aus = die Bridge öffnet immer sofort)
    1. Eintrag mit eigener Regel → diese.
    2. Eintrag auf *Wie die Person* → die **Regel der Person** (Person wählen → *Regel für die gewählte Person*; ohne Einstellung *Immer*).
    3. Zugang ohne Namen → *Regel für Zugänge ohne Namen*.

    | Regel | Was passiert |
    |---|---|
    | Immer (öffnen) | Tür öffnet |
    | Gesperrt | bleibt zu, Ereignis „abgelehnt“ |
    | Nur Automation | bleibt zu, deine Automationen laufen (Geräte-Auslöser *Entsperrt …*, Ergebnis *Nur Automation*) |
    | Nur 6–22 Uhr / Nur werktags 7–19 Uhr | nur Person |
    | Zeitfenster | nur Eintrag: bis zu 3 × Von/Bis/Tage, öffnet wenn **eines** passt |
    | Nur wenn jemand zu Hause ist | öffnet nur, wenn jemand zu Hause ist |

    **Notweg** (Home Assistant weg oder antwortet nicht binnen 2 s): *Alle erkannten Zugänge öffnen* / *Nur für den Notweg erlaubte Einträge* (*Notweg für den Eintrag*) / *Keiner* – dann bleibt die Tür ohne Home Assistant zu. Liegt in der Bridge, gilt auch ohne WLAN.
