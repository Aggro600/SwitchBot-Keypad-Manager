enroll:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: switchbot_keypad_manager
    person:
      required: true
      selector:
        text:
    what:
      required: true
      selector:
        select:
          translation_key: what
          options: ["thumb_right", "index_right", "middle_right", "ring_right", "little_right", "thumb_left", "index_left", "middle_left", "ring_left", "little_left", "face", "palm", "pin_random", "nfc_card"]
    validity:
      default: permanent
      selector:
        select:
          translation_key: validity
          options: ["permanent", "today", "24h", "1w", "1m", "once"]
delete:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: switchbot_keypad_manager
    entry_id:
      required: true
      selector:
        text:
sync:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: switchbot_keypad_manager
